name: jak_wypije
description: "JakWypiję – odkrywanie Krakowa pieszo: atrakcje, bary poza tłokiem i bezpieczny powrót (HackYeah, Smart City)."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.5.0 <4.0.0'
  # 3.41+: SliverReorderableList.onReorderItem (onReorder is deprecated).
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  mobile_scanner: ^6.0.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <0.21.0'
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/legal/
    # Nunito bundled offline (OFL) – google_fonts uses these instead of downloading.
    - assets/google_fonts/
